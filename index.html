<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17121f">
  <title>6:17 — 노을이 지지 않는 방</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <div id="intro" class="intro">
    <div class="intro-card">
      <p class="eyebrow">A POINT & CLICK MYSTERY</p>
      <h1>6:17</h1>
      <h2>노을이 지지 않는 방</h2>
      <p>“우리 집에 와줄래? 그리고 토끼 그림은 절대 떼지 마.”</p>
      <button id="startBtn" class="primary">방에 들어가기</button>
    </div>
  </div>
  <div class="app">
    <header class="topbar">
      <div class="brand"><b>6:17</b><span id="chapter">CHAPTER 01 · 낯선 평온</span></div>
      <div class="top-actions">
        <span id="time">18:17</span>
        <button id="notesBtn" aria-label="추리 노트 열기">추리 노트</button>
        <button id="hintBtn">힌트</button>
        <button id="resetBtn" aria-label="처음부터">↻</button>
      </div>
    </header>
    <main class="game-layout">
      <section class="play-area">
        <div class="scene" id="scene" aria-label="방 탐색">
          <img src="assets/room.png" alt="노을이 비치는 방" draggable="false">
          <button class="hot rabbit" data-place="rabbit" aria-label="토끼 그림 조사"></button>
          <button class="hot photos" data-place="photos" aria-label="사진 조사"></button>
          <button class="hot desk" data-place="desk" aria-label="책상 조사"></button>
          <button class="hot clock" data-place="clock" aria-label="시계 조사"></button>
          <button class="hot window" data-place="window" aria-label="창문 조사"></button>
          <button class="hot bed" data-place="bed" aria-label="침대 조사"></button>
          <button class="hot phone" data-place="phone" aria-label="휴대폰 조사"></button>
          <button class="hot door" data-place="door" aria-label="출입문 조사"></button>
          <div class="detail hidden" id="detail" aria-live="polite">
            <div class="detail-photo" id="detailPhoto"></div>
            <div class="detail-shade"></div>
            <button class="back-btn" id="backBtn">← 방으로 돌아가기</button>
            <div class="detail-content">
              <div class="detail-title" id="detailTitle"></div>
              <div class="detail-description" id="detailDescription"></div>
              <div class="detail-actions" id="detailActions"></div>
            </div>
          </div>
        </div>
        <div class="narration" id="narration" aria-live="polite">물건을 조사해 사건의 단서를 찾아보자.</div>
      </section>
      <section class="inventory-area">
        <div class="inventory-head"><strong>보관함</strong><span id="selectedInfo">물건을 선택해 사용하거나 두 개를 조합할 수 있어.</span></div>
        <div class="inventory" id="inventory"></div>
        <div class="inventory-controls">
          <button id="combineBtn" disabled>조합하기</button>
          <button id="clearBtn">선택 해제</button>
        </div>
      </section>
    </main>
  </div>
  <div id="modalRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
